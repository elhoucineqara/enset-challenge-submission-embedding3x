spring.application.name=auth-service
server.port=${AUTH_SERVICE_PORT:8081}

# PostgreSQL
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:fallback-secret-change-in-production-minimum-32-chars-needed}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# CORS
allowed.origins=http://localhost:3000,http://localhost:8080

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
